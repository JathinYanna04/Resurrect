name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Before posting, remove passwords, tokens, IP addresses, tailnet names and anything else personal from logs.**
  - type: textarea
    id: device
    attributes:
      label: Device report
      description: Output of `rez device --report` (safe to share; no serials or addresses).
      render: text
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. rez install ...\n2. ..."
  - type: textarea
    id: doctor
    attributes:
      label: rez doctor output
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: From `~/.local/state/resurrect/logs/` (rez.log, boot.log, MODULE.log). Check them for secrets first.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed passwords, tokens, addresses and other personal data from everything above.
          required: true
